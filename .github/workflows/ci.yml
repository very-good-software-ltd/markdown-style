name: CI

on:
  push:
    # Defining a branch filter and no tag filter is what keeps tag pushes from
    # re-running this: a release tag's commit was already checked on the branch.
    # A workflow only runs for ref types it names, so filtering tags alone would
    # stop it running for branches too.
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Markdown
        run: cargo run --quiet -- lint .

  # The tool has to work on Windows, not only compile there. Path separators
  # and line endings differ, and a Linux runner sees neither. Formatting and
  # clippy are platform-independent, so they stay in `check` and run once.
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Markdown
        run: cargo run --quiet -- lint .
